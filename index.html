<div id="app"></div>

<script>
/* ══════════ 1. 저장 계층 ══════════ */
const HAS_WS = typeof window.storage !== 'undefined';
const MEM = {};
const LS = (()=>{ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }catch(e){ return null; } })();

const local = {
  async get(k){
    if(HAS_WS){ try{ const r = await window.storage.get(k); return r?JSON.parse(r.value):null; }catch(e){ return MEM[k]??null; } }
    if(LS){ const v = LS.getItem(k); return v?JSON.parse(v):null; }
    return MEM[k] ?? null;
  },
  async set(k,v){
    MEM[k]=v;
    if(HAS_WS){ try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){} return; }
    if(LS){ try{ LS.setItem(k, JSON.stringify(v)); }catch(e){} }
  }
};

/* ══════════ 2. 시트 동기화 ══════════ */
let cfg = {url:'', token:''};
let syncState = 'local';   // local | ok | busy | off
const dirty = new Set();
let pushTimer = null;

function setSync(s){
  syncState = s;
  const el = document.getElementById('sync');
  if(el){ el.className = 'sync '+(s==='ok'?'ok':s==='off'?'off':s==='busy'?'busy':''); el.innerHTML = syncText(); }
}
function syncText(){
  if(!cfg.url) return '<b></b>이 기기에만 저장 중 · <button onclick="go(\'set\')">연동 설정</button>';
  if(syncState==='busy') return '<b></b>시트와 맞추는 중…';
  if(syncState==='off')  return '<b></b>연결 안 됨 · 이 기기에 보관했다가 다시 올립니다';
  return '<b></b>구글 시트에 동기화됨';
}

async function post(body){
  const r = await fetch(cfg.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // 프리플라이트를 피하려면 text/plain
    body: JSON.stringify(Object.assign({token:cfg.token}, body))
  });
  return r.json();
}

async function pull(){
  if(!cfg.url) return;
  setSync('busy');
  try{
    const r = await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token)+'&action=all');
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||'실패');
    const remote = d.data || {};
    let changed = false;
    for(const k of ['log','recent','day:'+TKEY]){
      if(!remote[k]) continue;
      let rv; try{ rv = JSON.parse(remote[k]); }catch(e){ continue; }
      const lv = await local.get(k);
      if(!lv || (rv._ts||0) > (lv._ts||0)){ await local.set(k, rv); changed = true; }
    }
    if(changed){
      day = Object.assign(blank(), await local.get('day:'+TKEY));
      log = (await local.get('log')) || {};
    }
    setSync('ok');
    if(changed && view==='home') render();
  }catch(e){ setSync('off'); }
}

function markDirty(k){
  dirty.add(k);
  if(!cfg.url) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 1200);
}
async function push(){
  if(!cfg.url || !dirty.size) return;
  const items = [];
  for(const k of dirty){ const v = await local.get(k); if(v) items.push({key:k, value:JSON.stringify(v)}); }
  setSync('busy');
  try{
    const d = await post({items});
    if(!d.ok) throw new Error(d.error||'실패');
    dirty.clear(); setSync('ok');
  }catch(e){
    setSync('off');
    clearTimeout(pushTimer); pushTimer = setTimeout(push, 20000);
  }
}
window.addEventListener('online', ()=>{ pull().then(push); });

/* ══════════ 3. 날짜 ══════════ */
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = new Date(), TKEY = key(TODAY), DOW = TODAY.getDay();
const isTransDay = DOW===1||DOW===3||DOW===5;
const isToeicDay = DOW===2||DOW===4||DOW===6;

/* ══════════ 4. 모델 ══════════ */
const blank = () => ({
  trans:{ set:[], answers:Array(10).fill(''), fb:null, done:false },
  toeic:{ marks:Array(20).fill(0), memo:'', done:false },
  shadow:{ sec:0, at:'', done:false }
});
let day = blank(), log = {};

async function saveDay(){
  day._ts = Date.now();
  log[TKEY] = { t:day.trans.done?1:0, k:day.toeic.done?1:0, s:day.shadow.done?1:0 };
  log._ts = Date.now();
  await local.set('day:'+TKEY, day);
  await local.set('log', log);
  markDirty('day:'+TKEY); markDirty('log');
}

  {ko:'그는 매주 토요일마다 헬스장에 가는 것을 거르지 않아요.',focus:'never skips'},
  {ko:'설명서를 읽어도 조립 방법이 잘 이해되지 않았어요.',focus:'make sense of'},
  {ko:'세탁기가 고장 나서 수리 기사를 부르기로 했습니다.',focus:'break down'},
  {ko:'통장에서 자동으로 빠져나가는 보험료를 확인해야 해요.',focus:'be withdrawn automatically'}
];
const pick=(a,n)=>{const c=[...a],o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o;};

async function callClaude(prompt){
  let text;
  if(cfg.url){
    const d = await post({action:'ai', prompt});
    if(!d.ok) throw new Error(d.error);
    text = d.text;
  }else{
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user',content:prompt}]})
    });
    const d = await r.json();
    text = (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  }
  return JSON.parse(text.replace(/```json|```/g,'').trim());
}

async function newSet(){
  const focus = FOCUS[Math.floor(Math.random()*FOCUS.length)];
  const topics = pick(TOPIC,5).join(', ');
  const rec = (await local.get('recent')) || {list:[]};
  const p =
`한국인 영어 학습자를 위한 한→영 영작 연습 문제를 만든다. 한국어 문장 10개를 생성하라.

조건
- 영어로 옮길 때 토익 Part 5~6 수준(중급~중상급)의 어휘·문법이 필요한 문장
- 오늘의 문법 초점: ${focus} — 10개 중 3~4개에 자연스럽게 녹여낼 것
- 소재는 다음에서 고루 섞을 것: ${topics}
- 각 문장은 한국어 25~55자, 완결된 한 문장
- 번역투가 아닌 실제로 쓰는 자연스러운 한국어
- 다음 문장들과 소재·구조가 겹치지 않게: ${(rec.list||[]).slice(0,20).join(' / ') || '없음'}
- 무작위 시드 ${Math.random().toString(36).slice(2,8)}

출력은 JSON 배열만. 설명·마크다운 없이:
[{"ko":"한국어 문장","focus":"핵심 영어 표현 2~4단어"}]`;
  try{
    const arr = await callClaude(p);
    const set = arr.filter(x=>x&&x.ko).slice(0,10);
    if(set.length<10) throw 0;
    const next = {list:[...set.map(s=>s.ko), ...(rec.list||[])].slice(0,40), _ts:Date.now()};
    await local.set('recent', next); markDirty('recent');
    return set;
  }catch(e){ return pick(BANK,10); }
}

async function grade(){
  const items = day.trans.set.map((s,i)=>({i:i+1, ko:s.ko, en:(day.trans.answers[i]||'').trim()}));
  const out = [];
  for(const c of [items.slice(0,5), items.slice(5,10)]){
    const p =
`한국인 학습자의 한→영 영작을 첨삭한다. 각 항목마다
- model: 자연스럽고 시험에 통하는 모범 영작 한 문장
- note: 한국어 한 줄 코멘트(45자 이내). 가장 중요한 오류 하나만 짚거나, 잘 썼으면 무엇이 좋았는지. 답이 비었으면 "미작성 — 모범답안 참고".

${c.map(x=>`${x.i}. 한국어: ${x.ko}\n   학습자 영작: ${x.en||'(비어 있음)'}`).join('\n')}

출력은 JSON 배열만. 설명·마크다운 없이:
[{"i":1,"model":"...","note":"..."}]`;
    try{ out.push(...await callClaude(p)); }catch(e){}
  }
  return out.length ? out : null;
}

const app = document.getElementById('app');
let view='home', ti=0, hintOn=false, busy=false, errMsg='';

const doneCount = () => day.trans.answers.filter(a=>a.trim()).length;

function render(){

}

      <div class="meter"><i style="width:${doneCount()*10}%"></i></div></button>`;

      <div class="meter"><i style="width:${day.toeic.marks.filter(m=>m).length*5}%"></i></div></button>`;

      ${day.shadow.done?'<div class="seal">完</div>':''}<div class="days">매일</div>
      <h3>인턴 쉐도잉 20분</h3><p>${fmt(day.shadow.sec)} 누적${day.shadow.at?` · ${esc(day.shadow.at)}`:''}</p>

      <h1>루틴 노트</h1></div>
      <button class="gear" onclick="go('set')" aria-label="연동 설정">⚙</button></div>

    <div class="week">${week}</div>
    <div class="sec"><h2>오늘의 루틴</h2><span>${todays.length}개</span></div>
    ${todays.join('')}

/* ── 번역 ── */
async function ensureSet(){
  if(day.trans.set.length===10) return;
  busy=true; render();
  day.trans.set = await newSet();
  busy=false; await saveDay(); render();
}
function trans(){
  if(busy) return shell(`<div class="ko"><span><span class="spin"></span>한국어 문장을 만드는 중…</span></div>`,'영어 문장 10개 번역','');
  const s = day.trans.set[ti] || {ko:'',focus:''};
  shell(`
    <div class="dots">${day.trans.set.map((_,i)=>`<i class="${i===ti?'c':(day.trans.answers[i].trim()?'f':'')}"></i>`).join('')}</div>
    <div class="ko">${esc(s.ko)}</div>
    <div class="hintrow"><button class="hint ${hintOn?'on':''}" onclick="toggleHint()">${hintOn?esc(s.focus||'힌트 없음'):'힌트 보기'}</button></div>
    <textarea class="en" id="en" placeholder="영어로 옮겨 적기" oninput="onEn(this.value)" spellcheck="false">${esc(day.trans.answers[ti])}</textarea>
    <div class="nav">
      <button class="btn" onclick="step(-1)" ${ti===0?'disabled':''}>← 이전</button>
      ${ti===9?`<button class="btn solid" onclick="finishTrans()">10개 완료</button>`
              :`<button class="btn solid" onclick="step(1)">다음 →</button>`}
    </div>
    <button class="btn ghost wide" onclick="regen()">새 문장 10개 받기</button>
    ${errMsg?`<div class="err">${esc(errMsg)}</div>`:''}
    ${day.trans.fb?fbHtml():''}
    ${day.trans.done&&!day.trans.fb?`<button class="btn red wide" onclick="doGrade()">AI 첨삭 받기</button>`:''}
  `,'영어 문장 10개 번역',`${ti+1} / 10`);
  const t=document.getElementById('en'); if(t){ t.focus({preventScroll:true}); t.setSelectionRange(t.value.length,t.value.length); }
}
function fbHtml(){
  return `<div class="sec" style="margin:26px 0 10px"><h2>첨삭</h2><span>모범답안 · 코멘트</span></div>`+
    day.trans.fb.map(f=>{const i=(f.i||0)-1, ko=day.trans.set[i]?day.trans.set[i].ko:'';
      return `<div class="fb"><div class="n">${pad(f.i)}</div><div class="k">${esc(ko)}</div>
        <div class="m">${esc(f.model)}</div><div class="y">내 답: ${esc(day.trans.answers[i]||'—')}</div>
        <div class="c">${esc(f.note)}</div></div>`;}).join('');
}
function toggleHint(){ hintOn=!hintOn; render(); }
function onEn(v){ day.trans.answers[ti]=v; clearTimeout(onEn._t); onEn._t=setTimeout(saveDay,500); }
function step(n){ ti=Math.max(0,Math.min(9,ti+n)); hintOn=false; saveDay(); render(); }
async function regen(){
  day.trans.set=[]; day.trans.answers=Array(10).fill(''); day.trans.fb=null; day.trans.done=false; ti=0;
  await saveDay(); await ensureSet();
}
async function finishTrans(){ day.trans.done=true; await saveDay(); render(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
async function doGrade(){
  errMsg='';
  const b=document.querySelector('.btn.red'); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span>첨삭하는 중…'; }
  const fb=await grade();
  if(!fb) errMsg='첨삭을 받지 못했습니다. 연동 설정에서 웹앱 주소와 API 키를 확인한 뒤 다시 눌러 주세요.';
  else day.trans.fb=fb.sort((a,b)=>a.i-b.i);
  await saveDay(); render();
}

/* ── 토익 ── */
function toeic(){
  const o=day.toeic.marks.filter(m=>m===1).length, dn=day.toeic.marks.filter(m=>m).length;
  shell(`
    <div class="score"><b>${o}</b><em>/ 20 정답 · ${dn}문항 채점</em></div>
    <div class="qgrid">${day.toeic.marks.map((m,i)=>`<button class="q ${m===1?'o':m===2?'x':''}" onclick="mark(${i})"><span>${pad(i+1)}</span></button>`).join('')}</div>
    <p class="note" style="margin-top:0">번호를 누를 때마다 <b>미표시 → ○ → ×</b> 로 바뀝니다.</p>
    <label class="lbl">틀린 문항 메모</label>
    <textarea class="memo" rows="4" placeholder="예) 6번 Part1 사람 없는 사진, 12번 시제 혼동" oninput="onMemo(this.value)">${esc(day.toeic.memo)}</textarea>
    <button class="btn ${day.toeic.done?'':'solid'} wide" style="margin-top:18px" onclick="finishToeic()">${day.toeic.done?'기록 완료됨 · 다시 열기':'오늘 20문제 완료'}</button>
  `,'토익 LC 20문제',`${dn} / 20`);
}
function mark(i){ day.toeic.marks[i]=(day.toeic.marks[i]+1)%3; saveDay(); render(); }
function onMemo(v){ day.toeic.memo=v; clearTimeout(onMemo._t); onMemo._t=setTimeout(saveDay,500); }
function finishToeic(){ day.toeic.done=!day.toeic.done; saveDay(); render(); }

/* ── 쉐도잉 ── */
const GOAL=1200; let tick=null, startAt=null;
const fmt=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
function shadow(){
  const left=Math.max(0,GOAL-day.shadow.sec), C=2*Math.PI*94, off=C*(1-Math.min(1,day.shadow.sec/GOAL));
  shell(`
    <div class="clock"><div class="ring">
      <svg width="210" height="210">
        <circle cx="105" cy="105" r="94" fill="none" stroke="rgba(63,107,78,.16)" stroke-width="7"/>
        <circle cx="105" cy="105" r="94" fill="none" stroke="${left?'#17231D':'#C8402E'}" stroke-width="7"
                stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
      </svg>
      <div class="t"><b>${fmt(left)}</b><span>${tick?'듣는 중':left?'남은 시간':'20분 달성'}</span></div>
    </div></div>
    <button class="btn solid wide" onclick="toggleTimer()">${tick?'멈추기':(day.shadow.sec?'이어서 듣기':'시작하기')}</button>
    <button class="btn ghost wide" onclick="resetTimer()">오늘 기록 초기화</button>
    <label class="lbl">멈춘 지점 / 오늘 장면</label>
    <input class="memo" value="${esc(day.shadow.at)}" placeholder="예) 00:12:30 벤이 첫 출근하는 장면" oninput="onAt(this.value)">
    <p class="note">20분을 채우면 오늘 칸에 도장이 찍힙니다.</p>
  `,'인턴 쉐도잉 20분',`${fmt(day.shadow.sec)} 누적`);
}
function toggleTimer(){
  if(tick){ stopTimer(); }
  else{
    startAt=Date.now();
    tick=setInterval(()=>{
      const el=Math.floor((Date.now()-startAt)/1000); startAt=Date.now();
      day.shadow.sec+=el;
      if(day.shadow.sec>=GOAL){ day.shadow.sec=GOAL; day.shadow.done=true; stopTimer(); }
      if(view==='shadow') render();
    },1000);
  }
  render();
}
function stopTimer(){ clearInterval(tick); tick=null; saveDay(); }
function resetTimer(){ stopTimer(); day.shadow.sec=0; day.shadow.done=false; saveDay(); render(); }
function onAt(v){ day.shadow.at=v; clearTimeout(onAt._t); onAt._t=setTimeout(saveDay,500); }

/* ── 연동 설정 ── */
let setMsg='';
function settings(){
  shell(`
    <p class="note" style="margin:0 0 18px">Apps Script 웹앱 주소와 토큰을 넣으면 이 기기의 기록이 구글 시트로 올라가고, 다른 기기에서도 같은 기록을 이어서 씁니다. 이 값은 기기 안에만 저장되며 어디에도 공개되지 않습니다.</p>
    <label class="lbl">웹앱 주소</label>
    <input class="memo" id="u" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" spellcheck="false">
    <label class="lbl">비밀 토큰</label>
    <input class="memo" id="t" value="${esc(cfg.token)}" placeholder="Code.gs 의 TOKEN 과 같은 값" autocapitalize="off" spellcheck="false">
    ${setMsg?`<div class="${setMsg.ok?'ok':'err'}">${esc(setMsg.text)}</div>`:''}
    <button class="btn solid wide" style="margin-top:18px" onclick="saveCfg()">저장하고 연결 확인</button>
    ${cfg.url?`<button class="btn ghost wide" onclick="clearCfg()">연동 끊기</button>`:''}
  `,'연동 설정','');
}
async function saveCfg(){
  cfg = { url: document.getElementById('u').value.trim().replace(/\/$/,''), token: document.getElementById('t').value.trim() };
  await local.set('cfg', cfg);
  setMsg=''; render();
  const b=document.querySelector('.btn.solid'); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span>확인하는 중…'; }
  try{
    const r=await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token)+'&action=all');
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'응답 오류');
    setMsg={ok:true,text:'연결됐습니다. 지금부터 기록이 시트에 함께 저장됩니다.'};
    await pull(); dirty.add('day:'+TKEY); dirty.add('log'); await push();
  }catch(e){
    setMsg={ok:false,text:'연결하지 못했습니다. 주소가 /exec 로 끝나는지, 배포 액세스가 "모든 사용자"인지, 토큰이 같은지 확인해 주세요.'};
  }
  render();
}
async function clearCfg(){ cfg={url:'',token:''}; await local.set('cfg',cfg); setMsg={ok:true,text:'연동을 껐습니다. 기록은 이 기기에 남아 있습니다.'}; render(); }

/* ── 껍데기 / 이동 ── */
function shell(body,title,count){
  app.innerHTML=`<div class="sheet"><div class="wrap">
    <div class="bar"><button class="back" onclick="go('home')">← 루틴 노트</button><div class="count">${count}</div></div>
    <h1 style="font-size:22px;margin-bottom:16px">${title}</h1>${body}</div></div>`;
}
function go(v){
  if(v!=='shadow'&&tick) stopTimer();
  view=v; errMsg=''; if(v!=='set') setMsg='';
  if(v==='trans'){ hintOn=false; render(); ensureSet(); return; }
  render();
  if(v==='home' && cfg.url) push();
}
Object.assign(window,{go,step,onEn,toggleHint,regen,finishTrans,doGrade,mark,onMemo,finishToeic,toggleTimer,resetTimer,onAt,saveCfg,clearCfg});
